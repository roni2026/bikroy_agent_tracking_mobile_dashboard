<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bikroy Mobile Command</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { background-color: #0f172a; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
        .glass { background: rgba(30, 41, 59, 0.95); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.1); }
        .modal { transition: transform 0.3s ease-out; transform: translateY(100%); }
        .modal.open { transform: translateY(0); }
    </style>
</head>
<body class="text-gray-200 min-h-screen flex flex-col pb-20">

    <nav class="glass sticky top-0 z-50 px-4 py-3 flex justify-between items-center shadow-lg">
        <h1 class="text-lg font-bold text-white tracking-wider"><span class="text-blue-500">BIKROY</span> CMD</h1>
        <div id="status-indicator" class="text-[10px] px-2 py-1 rounded bg-gray-800 text-gray-400 font-mono uppercase tracking-widest">OFFLINE</div>
    </nav>

    <main class="flex-1 p-4">
        <!-- Queues -->
        <div id="mobile-queues" class="flex flex-wrap gap-2 mb-6 justify-center">
            <div class="text-gray-500 text-xs w-full text-center">Waiting for Queues...</div>
        </div>

        <!-- Controls -->
        <div class="grid grid-cols-2 gap-3 mb-6">
            <button id="btn-start" class="col-span-2 bg-blue-600 active:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-lg flex items-center justify-center gap-2 text-lg transition-all">
                <i class="fas fa-play"></i> START TRACKING
            </button>
            <button id="btn-stop" class="bg-red-900/50 text-red-200 py-3 rounded-xl border border-red-800 font-semibold transition-all">STOP</button>
            <button id="btn-refresh" class="bg-gray-700 text-white py-3 rounded-xl font-semibold transition-all">REFRESH</button>
            <button id="btn-logs" class="col-span-2 bg-indigo-800 text-white py-3 rounded-xl font-semibold flex items-center justify-center gap-2 transition-all">
                <i class="fas fa-list-alt"></i> ACTIVITY LOGS
            </button>
        </div>

        <!-- Grid -->
        <div id="agent-grid" class="grid grid-cols-1 gap-4"></div>
    </main>

    <!-- SELECTOR MODAL -->
    <div id="selector-sheet" class="fixed bottom-0 left-0 w-full bg-gray-900 rounded-t-2xl border-t border-gray-700 z-50 h-[70vh] flex flex-col modal">
        <div class="p-4 border-b border-gray-800 flex justify-between items-center">
            <h3 class="font-bold text-white">Select Agents</h3>
            <button id="close-selector" class="text-gray-400 text-2xl">&times;</button>
        </div>
        <div id="agent-list" class="flex-1 overflow-y-auto p-4 space-y-2">
             <!-- Checkboxes injected here -->
        </div>
        <div class="p-4 border-t border-gray-800">
            <button id="confirm-start" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold flex items-center justify-center gap-2">
                CONFIRM START
            </button>
        </div>
    </div>

    <!-- LOGS MODAL -->
    <div id="logs-sheet" class="fixed bottom-0 left-0 w-full bg-gray-900 rounded-t-2xl border-t border-gray-700 z-50 h-[80vh] flex flex-col modal">
        <div class="p-4 border-b border-gray-800 flex justify-between items-center bg-gray-900 rounded-t-2xl sticky top-0">
            <h3 class="font-bold text-white">Activity Logs</h3>
            <button id="close-logs" class="text-gray-400 text-2xl">&times;</button>
        </div>
        <div id="logs-list" class="flex-1 overflow-y-auto p-4 space-y-2 bg-gray-900"></div>
        <div class="p-4 border-t border-gray-800 bg-gray-900">
            <button id="clear-logs" class="w-full bg-red-900/80 text-red-100 py-3 rounded-lg font-bold flex items-center justify-center gap-2">
                CLEAR HISTORY
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js';
        import { getDatabase, ref, set, onValue } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js';

        const firebaseConfig = {
              apiKey: "AIzaSyBAYXdb5CrlNOvI4VMEgg5XkdkDl7S6S-4",
              authDomain: "bikroytracker.firebaseapp.com",
              databaseURL: "https://bikroytracker-default-rtdb.firebaseio.com",
              projectId: "bikroytracker",
              storageBucket: "bikroytracker.firebasestorage.app",
              messagingSenderId: "58720742362",
              appId: "1:58720742362:web:a99c413e28b8a1f61eeee3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        const agentsList = ["Yeamin", "Udoy", "Salahuddin", "Halal", "Jisan", "Sarnali", "Asif", "Anik", "Riazul", "Sonjoy", "Minhazul", "Muzahid", "Mithun","Mili"];

        const els = {
            status: document.getElementById('status-indicator'),
            queues: document.getElementById('mobile-queues'),
            grid: document.getElementById('agent-grid'),
            btnStart: document.getElementById('btn-start'),
            btnStop: document.getElementById('btn-stop'),
            btnRefresh: document.getElementById('btn-refresh'),
            btnLogs: document.getElementById('btn-logs'),
            sheet: document.getElementById('selector-sheet'),
            agentList: document.getElementById('agent-list'),
            closeSelector: document.getElementById('close-selector'),
            confirmStart: document.getElementById('confirm-start'),
            logsSheet: document.getElementById('logs-sheet'),
            logsList: document.getElementById('logs-list'),
            closeLogs: document.getElementById('close-logs'),
            clearLogs: document.getElementById('clear-logs')
        };

        // State to track loading buttons
        let loadingStates = {
            start: false,
            stop: false,
            refresh: false,
            clearLogs: false
        };

        // Helper to set button loading
        function setButtonLoading(btn, isLoading, defaultText, iconClass = '') {
            if (isLoading) {
                btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Processing...`;
                btn.disabled = true;
                btn.classList.add('opacity-75', 'cursor-not-allowed');
            } else {
                btn.innerHTML = iconClass ? `<i class="${iconClass}"></i> ${defaultText}` : defaultText;
                btn.disabled = false;
                btn.classList.remove('opacity-75', 'cursor-not-allowed');
            }
        }

        // --- 1. LISTEN TO DATA ---
        const statusRef = ref(db, 'status');
        onValue(statusRef, (snapshot) => {
            const data = snapshot.val();
            
            // Reset loading states when we get new data (Server responded)
            if (data) {
                // Reset Refresh Button
                if (loadingStates.refresh) {
                    loadingStates.refresh = false;
                    setButtonLoading(els.btnRefresh, false, 'REFRESH');
                }
                // Reset Stop Button (if stopped)
                if (loadingStates.stop && !data.isRunning) {
                    loadingStates.stop = false;
                    setButtonLoading(els.btnStop, false, 'STOP');
                }
                // Reset Start Button (if started)
                if (loadingStates.start && data.isRunning) {
                    loadingStates.start = false;
                    // Note: Start button stays disabled by the status logic below, which is correct
                }
            }

            if(!data) return;

            if(data.isRunning) {
                els.status.textContent = "ONLINE • TRACKING";
                els.status.className = "text-[10px] px-2 py-1 rounded bg-green-900 text-green-200 font-mono uppercase tracking-widest animate-pulse";
                els.btnStart.innerHTML = '<i class="fas fa-satellite-dish fa-spin"></i> TRACKING...';
                els.btnStart.disabled = true;
                els.btnStart.classList.add('opacity-50');
                
                // Stop button should be enabled if running
                if (!loadingStates.stop) {
                    els.btnStop.disabled = false;
                    els.btnStop.classList.remove('opacity-50');
                }
            } else {
                els.status.textContent = "IDLE (READY)";
                els.status.className = "text-[10px] px-2 py-1 rounded bg-gray-700 text-gray-300 font-mono uppercase tracking-widest";
                
                if (!loadingStates.start) {
                    els.btnStart.innerHTML = '<i class="fas fa-play"></i> START TRACKING';
                    els.btnStart.disabled = false;
                    els.btnStart.classList.remove('opacity-50');
                }
                
                // Stop button disabled if idle
                els.btnStop.disabled = true;
                els.btnStop.classList.add('opacity-50');
            }

            renderQueues(data.reviewCounts);
            renderAgents(data.agentData, data.timeLabel);
            window.sessionLogs = data.sessionLogs || [];
        });

        // --- 2. UI INTERACTION ---

        // Open Selector
        els.btnStart.addEventListener('click', () => { 
            els.sheet.classList.add('open'); 
            els.agentList.innerHTML = agentsList.map(name => `
                <label class="flex items-center space-x-4 p-3 rounded-lg bg-gray-800 active:bg-gray-700 border border-gray-700">
                    <input type="checkbox" value="${name}" class="agent-cb w-5 h-5 accent-blue-600 rounded">
                    <span class="text-white font-medium text-lg">${name}</span>
                </label>
            `).join('');
        });
        
        els.closeSelector.addEventListener('click', () => els.sheet.classList.remove('open'));

        // Confirm Start
        els.confirmStart.addEventListener('click', () => {
            const selected = Array.from(document.querySelectorAll('.agent-cb:checked')).map(cb => cb.value);
            if(selected.length === 0) return alert("Select at least one agent.");
            
            // Set Loading
            loadingStates.start = true;
            setButtonLoading(els.confirmStart, true, 'CONFIRM START'); // Inner button loading
            
            set(ref(db, 'commands'), { action: 'start', payload: selected })
                .then(() => {
                    els.sheet.classList.remove('open');
                    setButtonLoading(els.confirmStart, false, 'CONFIRM START'); // Reset inner button
                    // Outer button handled by status listener
                });
        });

        // Stop
        els.btnStop.addEventListener('click', () => {
            loadingStates.stop = true;
            setButtonLoading(els.btnStop, true, 'STOP');
            set(ref(db, 'commands'), { action: 'stop' });
        });

        // Refresh
        els.btnRefresh.addEventListener('click', () => {
            loadingStates.refresh = true;
            setButtonLoading(els.btnRefresh, true, 'REFRESH');
            set(ref(db, 'commands'), { action: 'refresh' });
        });

        // Logs & Clear
        els.btnLogs.addEventListener('click', () => { els.logsSheet.classList.add('open'); renderLogs(window.sessionLogs); });
        els.closeLogs.addEventListener('click', () => els.logsSheet.classList.remove('open'));
        
        els.clearLogs.addEventListener('click', () => {
             loadingStates.clearLogs = true;
             setButtonLoading(els.clearLogs, true, 'CLEAR HISTORY');
             set(ref(db, 'commands'), { action: 'clearLogs' })
                .then(() => {
                    loadingStates.clearLogs = false;
                    setButtonLoading(els.clearLogs, false, 'CLEAR HISTORY');
                    els.logsSheet.classList.remove('open');
                });
        });

        // --- RENDERING ---

        function renderLogs(logs) {
            els.logsList.innerHTML = '';
            if(!logs || logs.length === 0) {
                els.logsList.innerHTML = '<div class="text-gray-500 text-center mt-10">No logs.</div>'; return;
            }
            logs.forEach(log => {
                const row = document.createElement('div');
                row.className = `p-3 rounded-lg border bg-gray-800 border-gray-700 mb-2 flex justify-between`;
                row.innerHTML = `<div><span class="text-gray-400 text-xs">${log.time}</span> <span class="text-white font-bold ml-2">${log.agent}</span></div><div class="text-gray-400 text-sm">${log.msg}</div>`;
                els.logsList.appendChild(row);
            });
        }

        function renderQueues(counts) {
            if(!counts) { els.queues.innerHTML = '<div class="text-gray-600 text-xs italic">Waiting...</div>'; return; }
            els.queues.innerHTML = '';
            
            const keys = ['member', 'listing_fee', 'general', 'manager', 'fraud', 'edited', 'verification', 'email'];
            const labels = { 'member': 'M', 'listing_fee': 'L', 'general': 'G', 'manager': 'MGR', 'fraud': 'FRD', 'edited': 'E', 'verification': 'V', 'email': 'MAIL' };
            
            keys.forEach(k => {
                if(counts[k] !== undefined) {
                    const count = counts[k];
                    let colorClass = "bg-gray-800 border-gray-700"; // Default Grey
                    let textClass = "text-white"; // Default White

                    // COLOR LOGIC
                    if (k === 'member' || k === 'listing_fee') { // M, L
                        if (count > 20) { colorClass = "bg-red-900/40 border-red-500"; textClass = "text-red-400"; }
                        else textClass = "text-gray-400"; // Grey
                    } 
                    else if (k === 'general') { // G
                        if (count > 250) { colorClass = "bg-red-900/40 border-red-500"; textClass = "text-red-400"; }
                        else if (count >= 200) { colorClass = "bg-yellow-900/40 border-yellow-500"; textClass = "text-yellow-400"; }
                        else textClass = "text-gray-400"; // Grey
                    }
                    else if (k === 'manager') { // MGR
                        if (count > 100) { colorClass = "bg-red-900/40 border-red-500"; textClass = "text-red-400"; }
                    }
                    else if (k === 'fraud') { // FRD
                        if (count > 70) { colorClass = "bg-red-900/40 border-red-500"; textClass = "text-red-400"; }
                    }
                    else if (k === 'edited') { // E
                        if (count > 250) { colorClass = "bg-red-900/40 border-red-500"; textClass = "text-red-400"; }
                        else if (count >= 150) { colorClass = "bg-yellow-900/40 border-yellow-500"; textClass = "text-yellow-400"; }
                    }
                    else if (k === 'verification') { // V
                        if (count > 2000) { colorClass = "bg-red-900/40 border-red-500"; textClass = "text-red-400"; }
                        else if (count >= 1500) { colorClass = "bg-yellow-900/40 border-yellow-500"; textClass = "text-yellow-400"; }
                    }

                    const div = document.createElement('div');
                    div.className = `flex-shrink-0 w-16 h-14 rounded-lg flex flex-col items-center justify-center border ${colorClass}`;
                    div.innerHTML = `<span class="text-[9px] text-gray-400 font-bold">${labels[k]}</span><span class="text-lg font-bold ${textClass}">${count}</span>`;
                    els.queues.appendChild(div);
                }
            });
        }

        function renderAgents(data, timeLabel) {
            if(!data) return;
            els.grid.innerHTML = '';
            const now = Date.now();
            const hourLabel = timeLabel || "This Hour";

            Object.keys(data).sort().forEach(name => {
                const agent = data[name];
                
                // INACTIVITY LOGIC (15 MINS)
                const lastActive = agent.lastActiveTime || now;
                const inactiveMs = now - lastActive;
                const inactiveMins = Math.floor(inactiveMs / 60000);
                const isInactive = inactiveMins >= 15;

                const cardClass = isInactive 
                    ? "bg-red-900/20 border-red-500 border rounded-xl p-4 transition duration-300" 
                    : "bg-gray-800 border-gray-700 border rounded-xl p-4"; 

                let inactiveBadge = isInactive 
                    ? `<span class="ml-2 text-[10px] bg-red-600 text-white px-2 py-0.5 rounded animate-pulse font-bold">Idle: ${inactiveMins}m</span>` 
                    : '';

                // --- FILTER PERMISSIONS ---
                let permText = agent.permissions || '-';
                const validCodes = ['M', 'L', 'G', 'V', 'E', 'MGR', 'FRD', 'MAIL'];
                if (permText !== '-' && permText !== 'N/A') {
                    const parts = permText.split(' ');
                    const filtered = parts.filter(code => validCodes.includes(code));
                    permText = filtered.length > 0 ? filtered.join(' ') : '-';
                }

                const card = document.createElement('div');
                card.className = cardClass;
                card.innerHTML = `
                    <div class="flex justify-between items-center mb-3">
                        <div class="flex flex-col">
                            <div class="flex items-center">
                                <h3 class="text-lg font-bold text-white">${name}</h3>
                                ${inactiveBadge}
                            </div>
                            <span class="text-[10px] text-gray-400 font-mono mt-0.5">${hourLabel}</span>
                        </div>
                        <span class="text-xs bg-gray-900 px-2 py-1 rounded text-purple-400 border border-gray-700 font-mono tracking-wider font-bold">
                            ${permText}
                        </span>
                    </div>
                    <div class="grid grid-cols-3 gap-2">
                        <div class="text-center bg-gray-900/50 rounded p-2 border border-gray-700/50">
                            <div class="text-xl font-bold text-blue-400">${agent.thisHourAds || 0}</div>
                            <div class="text-[8px] uppercase text-gray-500 font-bold">Total AD</div>
                        </div>
                        <div class="text-center bg-gray-900/50 rounded p-2 border border-gray-700/50">
                             <div class="text-xl font-bold text-purple-400">${agent.lastHourAds || 0}</div>
                            <div class="text-[8px] uppercase text-gray-500 font-bold">Last Hour</div>
                        </div>
                        <div class="text-center bg-gray-900/50 rounded p-2 border border-gray-700/50">
                             <div class="text-xl font-bold text-green-400">${agent.cumulativeNewAds || 0}</div>
                            <div class="text-[8px] uppercase text-gray-500 font-bold">SESS HR Total</div>
                        </div>
                    </div>
                `;
                els.grid.appendChild(card);
            });
        }
    </script>
</body>
</html>
